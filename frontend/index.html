<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auckland Explorer Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans justify-center items-center p-4">

    <main class="w-full max-w-2xl bg-slate-900/40 border border-slate-850 rounded-2xl flex flex-col overflow-hidden h-[85vh] shadow-2xl backdrop-blur-md">
        
        <header class="border-b border-slate-800 bg-slate-900/80 px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div id="geo-status-dot" class="h-2 w-2 rounded-full bg-amber-400 animate-pulse"></div>
                <span id="geo-status-text" class="font-semibold tracking-wider uppercase text-xs text-slate-400">Requesting GPS Location...</span>
            </div>
            <div class="text-[10px] bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2 py-0.5 rounded-full font-mono">Gemma 2 Hybrid Layer</div>
        </header>

        <div id="chat-log" class="flex-1 p-6 overflow-y-auto space-y-4 scrollbar-thin">
            <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl max-w-[85%] shadow-sm">
                <p class="text-xs text-slate-500 mb-1">Auckland Explorer AI</p>
                <p class="text-sm">Kia ora! I will analyze live transit options, Safeswim water reports, and weather alerts based on your real location. Enter your budget and vibe below!</p>
            </div>
        </div>

        <div class="p-4 border-t border-slate-800 bg-slate-950/60">
            <form id="explorer-form" class="flex flex-col space-y-3">
                <div class="flex space-x-2">
                    <input type="number" id="input-budget" placeholder="Budget ($)" step="0.1" class="w-1/4 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-emerald-400 focus:outline-none focus:border-emerald-500 transition-colors">
                    <input type="text" id="input-vibe" placeholder="What's the plan? (e.g., swim beach least walking)" required disabled class="w-3/4 bg-slate-900/50 border border-slate-800/60 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-blue-500 transition-colors cursor-not-allowed opacity-50">
                </div>
                <button type="submit" id="submit-btn" disabled class="w-full bg-slate-800 text-slate-500 text-sm font-medium py-2.5 rounded-xl transition cursor-not-allowed">
                    Awaiting Location Fix...
                </button>
            </form>
        </div>
    </main>

    <script src="app.js" type="module"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Auckland Explorer · Tāmaki Makaurau</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIINfQeNHNHm+2fY9GfT4k0zY3x8J5w0k="
        crossorigin=""
    />

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="">
    </script>

    <style>

        @import url(
            'https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=DM+Mono:wght@400;500&display=swap'
        );

        body {
            font-family: 'DM Sans', sans-serif;
        }

        .mono {
            font-family: 'DM Mono', monospace;
        }

        .pulse-dot {
            animation: pulse 1.5s cubic-bezier(.4,0,.6,1) infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: .3;
            }
        }

        .spinner {
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        select option {
            background: #1e293b;
            color: #e2e8f0;
        }

        .fade-in {
            animation: fadeIn .3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

    </style>
</head>


<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header
        class="bg-slate-900 border-b border-slate-800 px-5 py-3
               flex items-center justify-between shrink-0"
    >

        <div class="flex items-center gap-2">

            <span class="text-xl">
                🌊
            </span>

            <span class="font-semibold text-sm tracking-wide">
                Tāmaki Makaurau Explorer
            </span>

        </div>


        <div class="flex items-center gap-3">

            <div class="flex items-center gap-1.5">

                <div
                    id="geoDot"
                    class="w-2 h-2 rounded-full bg-amber-400 pulse-dot"
                ></div>

                <span
                    id="geoLabel"
                    class="mono text-xs text-slate-400"
                >
                    Locating…
                </span>

            </div>


            <button
                type="button"
                onclick="locateMe(true)"
                class="text-[11px] mono text-slate-400
                       hover:text-slate-200 bg-slate-800
                       hover:bg-slate-700 px-2 py-1 rounded
                       border border-slate-700 transition"
            >
                📍 Locate Me
            </button>

        </div>

    </header>



    <!-- =====================================================
         MAIN APPLICATION
    ====================================================== -->

    <main
        class="flex-1 overflow-hidden max-w-3xl w-full
               mx-auto p-4 flex flex-col gap-3"
    >


        <!-- =================================================
             MAP
        ================================================== -->

        <div
            class="relative w-full h-48 bg-slate-900
                   border border-slate-800 rounded-2xl
                   overflow-hidden shrink-0 shadow-lg"
        >

            <div
                id="exploreMap"
                class="w-full h-full z-0"
            ></div>

            <div
                id="locateResult"
                class="absolute bottom-2 left-2 z-10
                       bg-slate-950/80 backdrop-blur
                       border border-slate-800 rounded-lg
                       p-2 text-xs font-mono
                       text-slate-300 hidden max-w-[90%]"
            ></div>

        </div>



        <!-- =================================================
             CHAT
        ================================================== -->

        <div
            id="chatThread"
            class="flex-1 overflow-y-auto
                   space-y-4 pr-1 pb-4"
        >

            <div
                class="flex items-start gap-3 fade-in"
            >

                <div
                    class="w-8 h-8 rounded-full bg-blue-600
                           flex items-center justify-center
                           text-xs font-bold shrink-0"
                >
                    AI
                </div>

                <div
                    class="bg-slate-900 border border-slate-800
                           rounded-2xl rounded-tl-none
                           p-4 max-w-[85%] text-sm
                           leading-relaxed text-slate-200"
                >

                    Kia ora! I am your interactive AI guide
                    for Tāmaki Makaurau (Auckland).

                    Tell me what kind of place, activity,
                    or vibe you're looking for.

                </div>

            </div>

        </div>



        <!-- =================================================
             CHAT CONTROLS
        ================================================== -->

        <div
            class="shrink-0 bg-slate-900 p-3
                   rounded-2xl border border-slate-800
                   shadow-xl"
        >


            <!-- QUICK PROMPTS -->

            <div
                class="flex items-center gap-1.5
                       overflow-x-auto no-scrollbar
                       mb-2 pb-1 text-xs"
            >

                <button
                    type="button"
                    onclick="quickSend('Piha Beach swim and surf')"
                    class="bg-slate-800/80 hover:bg-slate-700
                           text-slate-300 border border-slate-700
                           px-2.5 py-1 rounded-full
                           whitespace-nowrap transition"
                >
                    🏖 Piha Beach
                </button>


                <button
                    type="button"
                    onclick="quickSend('Mission Bay family swim')"
                    class="bg-slate-800/80 hover:bg-slate-700
                           text-slate-300 border border-slate-700
                           px-2.5 py-1 rounded-full
                           whitespace-nowrap transition"
                >
                    🌴 Mission Bay
                </button>


                <button
                    type="button"
                    onclick="quickSend('Western Springs peaceful park walk')"
                    class="bg-slate-800/80 hover:bg-slate-700
                           text-slate-300 border border-slate-700
                           px-2.5 py-1 rounded-full
                           whitespace-nowrap transition"
                >
                    🌿 Western Springs
                </button>


                <button
                    type="button"
                    onclick="quickSend('Quiet coastal walk with sea views')"
                    class="bg-slate-800/80 hover:bg-slate-700
                           text-slate-300 border border-slate-700
                           px-2.5 py-1 rounded-full
                           whitespace-nowrap transition"
                >
                    🚶 Coastal Walk
                </button>

            </div>



            <!-- OPTIONS -->

            <div class="flex gap-2 mb-2">


                <!-- TRANSPORT -->

                <select
                    id="fMode"
                    class="flex-1 bg-slate-800
                           text-xs border border-slate-700
                           text-slate-200 rounded-xl px-2
                           h-10 focus:outline-none
                           focus:border-blue-500"
                >

                    <option value="public_transport">
                        🚌 Public Transport
                    </option>

                    <option value="drive">
                        🚗 Drive
                    </option>

                    <option value="cycle">
                        🚴 Cycle
                    </option>

                    <option value="walk">
                        🚶 Walk
                    </option>

                </select>



                <!-- RADIUS -->

                <select
                    id="fRadius"
                    class="flex-1 bg-slate-800
                           text-xs border border-slate-700
                           text-slate-200 rounded-xl px-2
                           h-10 focus:outline-none
                           focus:border-blue-500"
                >

                    <option value="2000">
                        2 km
                    </option>

                    <option value="5000">
                        5 km
                    </option>

                    <option value="10000" selected>
                        10 km
                    </option>

                    <option value="25000">
                        25 km
                    </option>

                    <option value="50000">
                        50 km
                    </option>

                    <option value="100000">
                        100 km
                    </option>

                </select>

            </div>



            <!-- CHAT FORM -->

            <form
                id="chatForm"
                class="flex gap-2 items-center"
            >

                <input
                    type="text"
                    id="fInput"
                    placeholder="What are you looking for in Auckland?"
                    class="flex-1 bg-slate-800
                           text-sm border border-slate-700
                           rounded-xl px-3.5 h-10
                           text-slate-100
                           placeholder-slate-500
                           focus:outline-none
                           focus:border-blue-500"
                    required
                >


                <button
                    type="submit"
                    id="sendBtn"
                    class="bg-blue-600 hover:bg-blue-500
                           text-white font-medium
                           text-sm px-4 h-10 rounded-xl
                           transition flex items-center
                           justify-center shrink-0"
                >
                    Send →
                </button>

            </form>

        </div>

    </main>


    <!-- =====================================================
         IMPORTANT:
         ALL APPLICATION JAVASCRIPT IS IN app.js
    ====================================================== -->
<script src="./app.js"></script>

</body>

</html>

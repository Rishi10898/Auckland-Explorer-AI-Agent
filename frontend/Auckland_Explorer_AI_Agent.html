<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auckland Explorer</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=DM+Mono:wght@400;500&display=swap');
  body { font-family: 'DM Sans', sans-serif; }
  .mono { font-family: 'DM Mono', monospace; }
  .pulse-dot { animation: pulse 1.5s cubic-bezier(.4,0,.6,1) infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .spinner { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  select option { background: #1e293b; color: #e2e8f0; }
  .chip-btn:hover { background: #0e4f6b22; border-color: #0e4f6b; color: #0e4f6b; }
  .fade-in { animation: fadeIn .4s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .ai-bubble { background: linear-gradient(135deg, #f0f9fc 0%, #e8f5ec 100%); border-left: 3px solid #1a7da0; }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; font-family: 'DM Mono', monospace; font-weight: 500; }
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

<header class="bg-slate-900 border-b border-slate-800 px-5 py-3 flex items-center justify-between sticky top-0 z-50">
  <div class="flex items-center gap-2">
    <span class="text-xl">🌊</span>
    <span class="font-semibold text-sm tracking-wide">Auckland Explorer</span>
  </div>
  <div class="flex items-center gap-2">
    <div id="geoDot" class="w-2 h-2 rounded-full bg-amber-400 pulse-dot"></div>
    <span id="geoLabel" class="mono text-xs text-slate-400">Locating…</span>
  </div>
</header>

<div class="bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 border-b border-slate-800 px-5 py-8 text-center">
  <p class="mono text-xs text-blue-400 tracking-widest mb-2 uppercase">AI-powered · Auckland only</p>
  <h1 class="text-2xl font-semibold mb-2">Find your perfect <span class="text-blue-400">escape</span></h1>
  <p class="text-sm text-slate-400 max-w-md mx-auto leading-relaxed">Tell the AI what vibe you're after. It cross-references weather and Safeswim water quality to find your spot.</p>
</div>

<main class="max-w-2xl mx-auto px-4 py-6 space-y-4">

  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
    <p class="mono text-xs text-slate-500 uppercase tracking-wider mb-4">What are you looking for?</p>

    <div class="mb-4">
      <label class="block text-xs text-slate-400 mb-1.5">How are you getting there?</label>
      <div class="grid grid-cols-4 gap-2" id="transportModes">
        <button onclick="selectMode('bus')" data-mode="bus" class="mode-btn bg-slate-800 border border-slate-700 rounded-lg py-2 text-xs text-slate-300 hover:border-blue-500 transition">🚌 Bus / Train</button>
        <button onclick="selectMode('drive')" data-mode="drive" class="mode-btn bg-slate-800 border border-slate-700 rounded-lg py-2 text-xs text-slate-300 hover:border-blue-500 transition">🚗 Drive</button>
        <button onclick="selectMode('cycle')" data-mode="cycle" class="mode-btn bg-slate-800 border border-slate-700 rounded-lg py-2 text-xs text-slate-300 hover:border-blue-500 transition">🚴 Cycle</button>
        <button onclick="selectMode('walk')" data-mode="walk" class="mode-btn bg-slate-800 border border-slate-700 rounded-lg py-2 text-xs text-slate-300 hover:border-blue-500 transition">🚶 Walk</button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
      <div>
        <label class="block text-xs text-slate-400 mb-1.5">Category</label>
        <select id="fCategory" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 h-10 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
          <option value="beach">🏖 Beach / swim</option>
          <option value="park">🌿 National park</option>
          <option value="coastal_walk">🚶 Coastal walk</option>
          <option value="reserve">🌳 Local reserve</option>
          <option value="restaurant">🍽 Restaurant</option>
        </select>
      </div>

      <div id="fareGroup" class="transit-only">
        <label class="block text-xs text-slate-400 mb-1.5">Fare type</label>
        <select id="fFareType" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 h-10 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
          <option value="adult">Adult</option>
          <option value="tertiary">Tertiary / HOP</option>
          <option value="child">Child (5–15)</option>
          <option value="senior">Senior (free)</option>
        </select>
      </div>
      <div id="budgetGroup" class="transit-only">
        <label class="block text-xs text-slate-400 mb-1.5">Transit Budget ($ NZD)</label>
        <input type="number" id="fBudget" placeholder="e.g. 10" min="0" step="1"
          class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 h-10 text-sm text-emerald-400 focus:outline-none focus:border-emerald-500 mono">
      </div>
    </div>

    <div class="mb-3">
      <label class="block text-xs text-slate-400 mb-1.5">Your vibe — tell the AI anything</label>
      <textarea id="fVibe" rows="2" placeholder="e.g. quiet sheltered beach, calm water for kids, easy park access…"
        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-blue-500 resize-none leading-relaxed"></textarea>
    </div>

    <div class="flex flex-wrap gap-2 mb-4">
      <button class="chip-btn text-xs border border-slate-700 bg-slate-800/50 text-slate-400 px-3 py-1.5 rounded-full transition" onclick="addVibe('calm sheltered swim, good for families')">Calm family swim</button>
      <button class="chip-btn text-xs border border-slate-700 bg-slate-800/50 text-slate-400 px-3 py-1.5 rounded-full transition" onclick="addVibe('dog friendly beach, off-leash area')">Dog friendly</button>
      <button class="chip-btn text-xs border border-slate-700 bg-slate-800/50 text-slate-400 px-3 py-1.5 rounded-full transition" onclick="addVibe('quiet hidden spot away from crowds')">Off the beaten track</button>
      <button class="chip-btn text-xs border border-slate-700 bg-slate-800/50 text-slate-400 px-3 py-1.5 rounded-full transition" onclick="addVibe('easy flat walk with good views')">Easy coastal walk</button>
      <button class="chip-btn text-xs border border-slate-700 bg-slate-800/50 text-slate-400 px-3 py-1.5 rounded-full transition" onclick="addVibe('patrolled beach, safe for swimming')">Patrolled and safe</button>
    </div>

    <button id="discoverBtn" onclick="runPhase1()" disabled
      class="w-full h-11 rounded-xl bg-slate-700 text-slate-400 text-sm font-medium cursor-not-allowed transition">
      Awaiting GPS fix…
    </button>
  </div>

  <div id="resultsArea"></div>

</main>

<script>
const API = 'http://127.0.0.1:8000';
let userLat = null, userLon = null;
let currentPlaceName = "Auckland Central";
let confirmedDest = null;
let selectedMode = 'bus';

// ── REVERSE GEOCODING ENGINE ──
async function fetchPlaceName(lat, lon) {
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18`);
    if (res.ok) {
      const data = await res.json();
      const addr = data.address || {};
      return addr.neighbourhood || addr.suburb || addr.residential || addr.village || addr.town || addr.city || "Auckland";
    }
  } catch (e) {
    console.warn("Reverse geocode failed:", e);
  }
  return "Auckland Central";
}

// ── GEO SETUP ──
async function setGeo(state, lat, lon) {
  const dot = document.getElementById('geoDot');
  dot.className = 'w-2 h-2 rounded-full';
  
  if (state === 'active') {
    dot.classList.add('bg-emerald-400');
    userLat = lat; userLon = lon;
    currentPlaceName = await fetchPlaceName(lat, lon);
    document.getElementById('geoLabel').textContent = currentPlaceName;
  } else if (state === 'error') {
    dot.classList.add('bg-rose-400');
    userLat = -36.8485; userLon = 174.7633;
    currentPlaceName = 'Auckland Central';
    document.getElementById('geoLabel').textContent = 'Auckland Central (fallback)';
  } else { 
    dot.classList.add('bg-amber-400', 'pulse-dot'); 
    return; 
  }

  const btn = document.getElementById('discoverBtn');
  btn.disabled = false;
  btn.className = 'w-full h-11 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold cursor-pointer transition';
  btn.textContent = 'Find my perfect spot →';
}

navigator.geolocation
  ? navigator.geolocation.getCurrentPosition(
      p => setGeo('active', p.coords.latitude, p.coords.longitude),
      () => setGeo('error')
    )
  : setGeo('error');

// ── TRANSPORT MODE SELECT ──
function selectMode(mode) {
  selectedMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.remove('border-blue-500', 'bg-blue-500/10', 'text-blue-300');
    b.classList.add('border-slate-700', 'text-slate-300');
  });
  
  const active = document.querySelector(`[data-mode="${mode}"]`);
  if (active) {
    active.classList.add('border-blue-500', 'bg-blue-500/10', 'text-blue-300');
    active.classList.remove('border-slate-700', 'text-slate-300');
  }

  // Toggle visibility of Public Transit specific options
  const transitElements = document.querySelectorAll('.transit-only');
  transitElements.forEach(el => {
    if (mode === 'bus') {
      el.classList.remove('hidden');
    } else {
      el.classList.add('hidden');
    }
  });
}
selectMode('bus');

function addVibe(text) {
  const v = document.getElementById('fVibe');
  v.value = (v.value ? v.value + ', ' : '') + text;
  v.focus();
}

// ── BUILD AI CONTEXT ──
function buildAIContext(data, vibe, category) {
  const w = data.live_auckland_weather || {};
  const m = w.metrics || {};
  const dest = data.recommended_place || {};
  const sw = data.safeswim_environmental_report || {};

  let ctx = `You are an Auckland local travel assistant. Give the user a concise, helpful recommendation based on current weather, water safety, and their choice of travel mode (${selectedMode}).\n\n`;

  ctx += `USER REQUEST:\n- Category: ${category}\n- Vibe: "${vibe}"\n- Transport mode: ${selectedMode.toUpperCase()}\n- Starting Location: ${currentPlaceName}\n\n`;

  if (w.status === 'success') {
    ctx += `LIVE WEATHER:\n- Condition: ${w.condition} – ${w.description}\n- Temp: ${Math.round(m.temp_actual_celsius ?? 0)}°C (feels like ${Math.round(m.temp_feels_like_celsius ?? 0)}°C)\n\n`;
  }

  if (dest.name) {
    ctx += `RECOMMENDED DESTINATION:\n- Name: ${dest.name}\n- Reason: ${dest.ai_reasoning || 'Matches vibe'}\n\n`;
  }

  if (sw.beach_name) {
    ctx += `WATER SAFETY (Safeswim):\n- Water quality: ${sw.water_quality || 'UNKNOWN'}\n- Patrolled: ${sw.patrolled ? 'Yes' : 'No'}\n\n`;
  }

  ctx += `INSTRUCTIONS:\n- Summarise why this destination fits their vibe.\n- Do not output fake route numbers or fake transit times.\n- Keep response short and conversational (2 short paragraphs max, no headers).`;

  return ctx;
}

// ── PHASE 1: DISCOVERY ──
async function runPhase1() {
  const category = document.getElementById('fCategory').value;
  const vibe = document.getElementById('fVibe').value || category;

  document.getElementById('resultsArea').innerHTML = loadingHTML('Finding your spot', [
    'Checking Auckland weather & water safety',
    'Matching destination to your vibe',
    'Generating directions options'
  ]);

  try {
    const res = await fetch(`${API}/api/recommend?vibe=${encodeURIComponent(vibe)}&lat=${userLat}&lon=${userLon}`);
    if (!res.ok) throw new Error(`API error: ${res.status}`);
    const data = await res.json();

    const aiSynthesis = await callAISynthesis(data, vibe, category);
    data.ai_synthesis = aiSynthesis;

    renderPhase1(data);
  } catch(e) {
    document.getElementById('resultsArea').innerHTML = errorHTML(e.message);
  }
}

async function callAISynthesis(data, vibe, category) {
  try {
    const prompt = buildAIContext(data, vibe, category);
    const res = await fetch(`${API}/api/ai-synthesis`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });
    if (res.ok) {
      const d = await res.json();
      return d.synthesis || null;
    }
  } catch(e) {
    console.warn('AI synthesis failed:', e);
  }
  return null;
}

// ── RENDER RESULTS & NAVIGATION LINKS ──
function renderPhase1(data) {
  const w = data.live_auckland_weather || {};
  const dest = data.recommended_place || {};
  const sw = data.safeswim_environmental_report || {};
  const m = w.metrics || {};
  const quality = (sw.water_quality || 'UNKNOWN').toUpperCase();

  confirmedDest = dest;
  let html = '';

  if (data.ai_synthesis) {
    html += `<div class="ai-bubble rounded-2xl p-5 mb-4 fade-in">
      <p class="text-xs mono text-slate-500 mb-2 uppercase tracking-wider">Local Recommendation</p>
      <p class="text-sm text-slate-700 leading-relaxed">${data.ai_synthesis}</p>
    </div>`;
  }

  if (w.status === 'success') {
    html += `<div class="rounded-xl border bg-slate-900 border-slate-800 px-4 py-3 flex flex-wrap items-center gap-4 mb-4 fade-in">
      <div>
        <div class="text-2xl font-semibold">${Math.round(m.temp_actual_celsius ?? 0)}°C</div>
        <div class="text-xs text-slate-400">${w.description || w.condition}</div>
      </div>
      <div class="flex gap-4 ml-auto flex-wrap">
        <div class="mono text-xs text-slate-400">Feels like <span class="text-slate-200">${Math.round(m.temp_feels_like_celsius ?? 0)}°C</span></div>
      </div>
    </div>`;
  }

  if (dest.name) {
    const swClass = quality === 'GREEN' || quality === 'GOOD' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30'
                  : quality === 'RED' || quality === 'POOR' ? 'bg-red-500/20 text-red-300 border-red-500/30'
                  : 'bg-slate-700 text-slate-400 border-slate-600';

    html += `<div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 mb-4 fade-in">
      <div class="flex items-start justify-between mb-3">
        <h2 class="font-semibold text-lg text-slate-100">${dest.name}</h2>
        <div class="flex gap-2">
          ${sw.patrolled ? `<span class="tag bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">🏊 Patrolled</span>` : ''}
          ${quality !== 'UNKNOWN' ? `<span class="tag border ${swClass}">Water: ${quality}</span>` : ''}
        </div>
      </div>`;

    // MODE-SPECIFICS & RELIABLE JOURNEY PLANNER LINKS
    const destNameEncoded = encodeURIComponent(`${dest.name}, Auckland`);
    
    if (selectedMode === 'bus') {
      const atLink = `https://at.govt.nz/bus-train-ferry/journey-planner/`;
      html += `
        <p class="text-xs text-slate-400 mb-4">For live timetable and real-time public transport schedules, check the official AT Journey Planner:</p>
        <a href="${atLink}" target="_blank" rel="noopener noreferrer" 
           class="inline-flex items-center justify-center gap-2 w-full h-11 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold transition">
          <span>🚍 Open AT Journey Planner</span>
          <span class="text-xs font-normal opacity-80">(Opens in new tab)</span>
        </a>`;
    } else {
      let gmapMode = 'driving';
      let modeIcon = '🚗';
      let modeLabel = 'Driving';

      if (selectedMode === 'cycle') { gmapMode = 'bicycling'; modeIcon = '🚴'; modeLabel = 'Cycling'; }
      if (selectedMode === 'walk') { gmapMode = 'walking'; modeIcon = '🚶'; modeLabel = 'Walking'; }

      const mapsLink = `https://www.google.com/maps/dir/?api=1&origin=${userLat},${userLon}&destination=${destNameEncoded}&travelmode=${gmapMode}`;
      
      html += `
        <p class="text-xs text-slate-400 mb-4">Get direct turn-by-turn ${modeLabel.toLowerCase()} navigation from ${currentPlaceName}:</p>
        <a href="${mapsLink}" target="_blank" rel="noopener noreferrer" 
           class="inline-flex items-center justify-center gap-2 w-full h-11 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold transition">
          <span>${modeIcon} Open ${modeLabel} Directions</span>
          <span class="text-xs font-normal opacity-80">(Google Maps)</span>
        </a>`;
    }

    html += `</div>`;
  }

  document.getElementById('resultsArea').innerHTML = html;
}

// ── UTILS ──
function loadingHTML(title, steps) {
  const items = steps.map((s, i) =>
    `<li class="flex items-center gap-2 text-xs text-slate-400">
      <div class="w-1.5 h-1.5 rounded-full ${i === 0 ? 'bg-blue-400 pulse-dot' : 'bg-slate-600'}"></div>${s}
    </li>`
  ).join('');
  return `<div class="bg-slate-900 border border-dashed border-slate-700 rounded-2xl p-8 text-center">
    <div class="spinner w-7 h-7 border-2 border-slate-700 border-t-blue-400 rounded-full mx-auto mb-4"></div>
    <p class="text-sm font-medium text-slate-300 mb-4">${title}</p>
    <ul class="space-y-2 text-left max-w-xs mx-auto">${items}</ul>
  </div>`;
}

function errorHTML(msg) {
  return `<div class="bg-red-950/40 border border-red-800 rounded-xl p-4 text-sm text-red-300">
    <p class="font-medium mb-1">⚠ Error loading data</p>
    <p class="text-xs opacity-75">${msg}</p>
  </div>`;
}
</script>
</body>
</html>

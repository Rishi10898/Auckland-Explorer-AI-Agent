<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>AI Explorer · Auckland Explorer</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link
        rel="stylesheet"
        href="styles.css"
    >

    <style>

        .ai-page {
            width: min(1000px, 94%);
            height: calc(100vh - 75px);
            margin: auto;

            display: flex;
            flex-direction: column;

            padding: 14px 0;
            gap: 10px;
        }


        /* HEADER */

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 14px 18px;
        }


        .chat-header h1 {
            margin: 2px 0 0;
        }


        .chat-header p {
            margin: 0;
            font-size: .7rem;
            color: var(--muted);
        }


        /* STATUS */

        .chat-status {
            display: flex;
            align-items: center;
            gap: 7px;

            font-size: .75rem;
            color: var(--muted);
        }


        .status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: var(--cyan);
        }


        .status-dot.error {
            background: #ff5c5c;
        }


        .status-dot.loading {
            animation: pulse 1s infinite;
        }


        @keyframes pulse {

            50% {
                opacity: .35;
            }

        }


        /* CHAT */

        .chat-thread {
            flex: 1;
            min-height: 0;

            overflow-y: auto;

            padding: 10px 4px;

            scroll-behavior: smooth;
        }


        .message {
            max-width: 78%;

            margin: 10px 0;

            padding: 12px 16px;

            border-radius: 18px;

            line-height: 1.55;

            animation: fadeIn .2s ease;
        }


        .message.ai {

            background:
                rgba(15, 23, 42, .82);

            border:
                1px solid var(--border);

        }


        .message.user {

            margin-left: auto;

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--violet)
                );

        }


        .message-name {

            font-size: .7rem;

            font-weight: 700;

            margin-bottom: 4px;

            opacity: .75;

        }


        /* CONTROLS */

        .chat-controls {

            padding: 12px;

            border-radius: 20px;

        }


        .quick-actions {

            display: flex;

            gap: 7px;

            overflow-x: auto;

            margin-bottom: 8px;

        }


        .quick-actions button {

            white-space: nowrap;

            padding: 7px 10px;

            border-radius: 999px;

            border:
                1px solid var(--border);

            background:
                rgba(15, 23, 42, .8);

            color:
                var(--muted);

            cursor: pointer;

        }


        .control-row {

            display: flex;

            gap: 8px;

            margin-bottom: 8px;

        }


        .control-row select {

            flex: 1;

        }


        .chat-input-row {

            display: flex;

            gap: 8px;

        }


        .chat-input-row input {

            flex: 1;

        }


        /* LOCATION BUTTON */

        .locate-btn {

            width: 38px;
            height: 38px;

            padding: 0;

            border-radius: 50%;

            display: grid;

            place-items: center;

        }


        /* MAP MODAL */

        .map-modal {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 1000;

            background:
                rgba(0, 0, 0, .7);

            align-items: center;

            justify-content: center;

        }


        .map-modal.active {

            display: flex;

        }


        .map-card {

            width:
                min(700px, 92vw);

            height:
                min(500px, 75vh);

            position: relative;

            overflow: hidden;

            border-radius: 20px;

        }


        #exploreMap {

            width: 100%;

            height: 100%;

        }


        .close-map {

            position: absolute;

            top: 10px;

            right: 10px;

            z-index: 1000;

            width: 35px;

            height: 35px;

            border-radius: 50%;

            border: none;

            cursor: pointer;

        }


        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        @media (max-width: 700px) {

            .message {
                max-width: 90%;
            }

            .ai-page {
                width: 96%;
            }

        }

    </style>

</head>


<body>


<nav class="nav">

    <a
        class="brand"
        href="index.html"
    >
        🌊 Auckland Explorer
    </a>


    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="explore.html">
            Explore
        </a>

        <a href="chat.html">
            AI Explorer
        </a>

        <a href="contact.html">
            Contact
        </a>

    </div>

</nav>


<main class="ai-page">


    <!-- HEADER -->

    <section class="card chat-header">
        <div class="chat-status">

            <span
                id="statusDot"
                class="status-dot"
            ></span>

            <span id="statusText">
                Getting location...
            </span>


            <button
                id="locateBtn"
                class="btn btn-secondary locate-btn"
                type="button"
                title="Show my location"
            >
                📍
            </button>

        </div>

    </section>


    <!-- CHAT -->

    <section
        id="chatThread"
        class="chat-thread"
    >

        <div class="message ai">

            <div class="message-name">
                🌊 Auckland Explorer
            </div>

            Kia ora! 👋 I'm your AI guide for
            Tāmaki Makaurau.

            Tell me what you'd like to explore,
            your budget, and how you'd like to travel.

        </div>

    </section>


    <!-- CONTROLS -->

    <section class="card chat-controls">


        <!-- QUICK PROMPTS -->

        <div class="quick-actions">

            <button
                type="button"
                data-prompt="Find me a peaceful beach"
            >
                🏖️ Beach
            </button>


            <button
                type="button"
                data-prompt="Find me a peaceful park walk"
            >
                🌿 Park
            </button>


            <button
                type="button"
                data-prompt="Find interesting attractions in Auckland"
            >
                ✨ Attractions
            </button>


            <button
                type="button"
                data-prompt="Find a coastal walk with sea views"
            >
                🌊 Coastal Walk
            </button>

        </div>


        <!-- OPTIONS -->

        <div class="control-row">

            <select id="fMode">

                <option value="public_transport">
                    🚌 Public Transport
                </option>

                <option value="drive">
                    🚗 Drive
                </option>

                <option value="cycle">
                    🚴 Cycle
                </option>

                <option value="walk">
                    🚶 Walk
                </option>

            </select>


            <select id="fRadius">

                <option value="2000">
                    2 km
                </option>

                <option value="5000">
                    5 km
                </option>

                <option
                    value="10000"
                    selected
                >
                    10 km
                </option>

                <option value="25000">
                    25 km
                </option>

                <option value="50000">
                    50 km
                </option>

            </select>

        </div>


        <!-- INPUT -->

        <form
            id="chatForm"
            class="chat-input-row"
        >

            <input
                id="fInput"
                class="input"
                type="text"
                placeholder="Ask about Auckland..."
                autocomplete="off"
                required
            >


            <button
                id="sendBtn"
                class="btn btn-primary"
                type="submit"
            >
                ↑
            </button>

        </form>

    </section>


</main>


<!-- MAP MODAL -->

<div
    id="mapModal"
    class="map-modal"
>

    <div class="card map-card">

        <button
            id="closeMap"
            class="close-map"
            type="button"
        >
            ×
        </button>


        <div id="exploreMap"></div>

    </div>

</div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>
<script src="chat.js"></script>
</body>
</html>

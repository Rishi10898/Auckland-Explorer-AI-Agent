<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" >
    <title>AI Explorer · Auckland Explorer</title>
  <link rel="stylesheet" href="styles.css" >
  <style>
    /* ===================================================== AI CHAT PAGE ===================================================== */ .ai-page  {
    width: min(1000px, 94%);
    height: calc(100vh - 75px);
    margin: auto;
    display: flex;
    flex-direction: column;
    padding: 12px 0;
    gap: 8px;
    }
    /* ===================================================== HEADER ===================================================== */ .chat-header  {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 18px;
    flex-shrink: 0;
    }
    .chat-header h1  {
    margin: 2px 0 0;
    }
    .chat-header p  {
    margin: 0;
    font-size: .7rem;
    color: var(--muted);
    letter-spacing: .08em;
    }
    .location-controls  {
    display: flex;
    align-items: center;
    gap: 10px;
    }
    /* ===================================================== LOCATION STATUS ===================================================== */ .chat-status  {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: .75rem;
    color: var(--muted);
    }
    .status-dot  {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--cyan);
    }
    .status-dot.error  {
    background: #ff5c5c;
    }
    .status-dot.loading  {
    animation: pulse 1s infinite;
    }
    @keyframes pulse  {
    50%  {
    opacity: .35;
    }
    }
    /* ===================================================== CHAT ===================================================== */ .chat-thread  {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 4px;
    scroll-behavior: smooth;
    }
    .message  {
    max-width: 78%;
    margin: 8px 0;
    padding: 12px 16px;
    border-radius: 18px;
    line-height: 1.55;
    animation: fadeIn .2s ease;
    }
    .message.ai  {
    background: rgba(15, 23, 42, .82);
    border: 1px solid var(--border);
    }
    .message.user  {
    margin-left: auto;
    background: linear-gradient( 135deg, var(--blue), var(--violet) );
    }
    .message-name  {
    font-size: .7rem;
    font-weight: 700;
    margin-bottom: 4px;
    opacity: .75;
    }
    /* ===================================================== CONTROLS ===================================================== */ .chat-controls  {
    padding: 10px;
    border-radius: 18px;
    flex-shrink: 0;
    }
    /* QUICK PROMPTS */ .quick-actions  {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    margin-bottom: 8px;
    }
    .quick-actions button  {
    white-space: nowrap;
    padding: 7px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(15, 23, 42, .8);
    color: var(--muted);
    cursor: pointer;
    }
    .quick-actions button:hover  {
    color: var(--text);
    border-color: var(--cyan);
    }
    /* OPTIONS */ .control-row  {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    }
    .control-row select  {
    flex: 1;
    }
    /* INPUT */ .chat-input-row  {
    display: flex;
    gap: 8px;
    }
    .chat-input-row input  {
    flex: 1;
    }
    /* ===================================================== LOCATION BUTTON ===================================================== */ .locate-btn  {
    width: 38px;
    height: 38px;
    min-width: 38px;
    padding: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 1rem;
    }
    /* ===================================================== SERVER STATUS ===================================================== */ .server-status  {
    font-size: .7rem;
    color: var(--muted);
    margin: 4px 2px 0;
    min-height: 16px;
    }
    /* ===================================================== ANIMATION ===================================================== */ @keyframes fadeIn  {
    from  {
    opacity: 0;
    transform: translateY(5px);
    }
    to  {
    opacity: 1;
    transform: translateY(0);
    }
    }
    /* ===================================================== MOBILE ===================================================== */ @media (max-width: 700px)  {
    .message  {
    max-width: 90%;
    }
    .ai-page  {
    width: 96%;
    }
    .chat-header  {
    padding: 10px 14px;
    }
    .chat-header h1  {
    font-size: 1.3rem;
    }
    .chat-status span:last-child  {
    display: none;
    }
    }
  </style>
</head>
<body>
    
  <!-- ===================================================== NAVIGATION ===================================================== -->
  <nav class="nav">
    <a class="brand" href="index.html" > 🌊 Auckland Explorer </a>
  <div class="nav-links">
    <a href="index.html"> Home </a>
  <a href="explore.html"> Explore </a>
<a href="chat.html"> AI Explorer </a>
<a href="contact.html"> Contact </a>
</div>
</nav>
<!-- ===================================================== AI CHAT ===================================================== -->
<main class="ai-page">

  <!-- HEADER -->
  <section class="card chat-header">
    <div>
      <p> AI TRAVEL GUIDE </p>
  </div>
  <div class="location-controls">
    <div class="chat-status">
      <span id="statusDot" class="status-dot" >
      </span>
      <span id="statusText"> Getting location... </span>
  </div>
  <button id="locateBtn" class="btn btn-secondary locate-btn" type="button" title="Update location" > 📍 </button>
</div>
</section>
<!-- ================================================= CHAT THREAD ================================================= -->
<section id="chatThread" class="chat-thread" >
  <div class="message ai">
    <div class="message-name"> 🌊 Auckland Explorer </div> Kia ora! 👋 I'm your AI guide for Tāmaki Makaurau. <br>
    <br> Tell me what you'd like to explore, your budget, and how you'd like to travel. </div>
  </section>
  <!-- ================================================= CONTROLS ================================================= -->
  <section class="card chat-controls">
    <!-- QUICK PROMPTS -->
    <div class="quick-actions">
      <button type="button" data-prompt="Find me a peaceful beach" > 🏖️ Beach </button>
    <button type="button" data-prompt="Find me a peaceful park walk" > 🌿 Park </button>
  <button type="button" data-prompt="Find interesting attractions in Auckland" > ✨ Attractions </button>
<button type="button" data-prompt="Find a coastal walk with sea views" > 🌊 Coastal Walk </button>
</div>
<!-- OPTIONS -->
<div class="control-row">
  <select id="fMode">
    <option value="public_transport"> 🚌 Public Transport </option>
  <option value="drive"> 🚗 Drive </option>
<option value="cycle"> 🚴 Cycle </option>
<option value="walk"> 🚶 Walk </option>
</select>
<select id="fRadius">
  <option value="2000"> 2 km </option>
<option value="5000"> 5 km </option>
<option value="10000" selected > 10 km </option>
<option value="25000"> 25 km </option>
<option value="50000"> 50 km </option>
</select>
</div>
<!-- SERVER STATUS -->
<div id="serverStatus" class="server-status" aria-live="polite" > Ready </div>
<!-- INPUT -->
<form id="chatForm" class="chat-input-row" >
  <input id="fInput" class="input" type="text" placeholder="Ask about Auckland..." autocomplete="off" required >
  <button id="sendBtn" class="btn btn-primary" type="submit" > ↑ </button>
</form>
</section>
</main>
<!-- ===================================================== JAVASCRIPT ===================================================== -->
<script src="chat.js">
</script>
</body>
</html>

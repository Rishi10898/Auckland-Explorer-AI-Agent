# Purpose: keep the existing production API service and define an isolated
# staging service that also has the repository frontend available to FastAPI.
services:
  - type: web
    name: auckland-explorer-ai-agent-api
    runtime: python
    plan: free
    region: Virginia (US East)
    rootDir: backend
    buildCommand: pip install -r app/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: deepseek-ai/deepseek-v4.1-flash
      - key: OPEN_WEATHER_API_KEY
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
  - type: web
    name: auckland-explorer-ai-agent-staging
    runtime: python
    plan: free
    region: Virginia (US East)
    rootDir: .
    buildCommand: pip install -r backend/app/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_DIR
        value: frontend
      - key: BACKEND_DIR
        value: backend
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: deepseek-ai/deepseek-v4.1-flash
      - key: OPEN_WEATHER_API_KEY
        sync: false
      - key: TOMTOM_API_KEY
        sync: false

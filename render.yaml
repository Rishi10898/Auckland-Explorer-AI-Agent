services:
  - type: web
    name: auckland-explorer-ai-agent-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r app/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: OPEN_WEATHER_API_KEY
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
